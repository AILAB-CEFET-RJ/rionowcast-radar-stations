[metadata]
name = rionowcast-radar-stations
version = 0.1.0
description = Pipeline de nowcasting com radar do Sumare e estacoes pluviometricas.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    nowcasting-train = nowcasting.cli.train:main
    nowcasting-train-stations = nowcasting.cli.train_station_baseline:main
    nowcasting-compare = nowcasting.cli.compare_experiments:main
    nowcasting-build-radar = nowcasting.cli.build_radar_memmaps:main
    nowcasting-build-alertario-targets = nowcasting.cli.build_alertario_targets:main
    nowcasting-build-websirene-targets = nowcasting.cli.build_websirene_targets:main
    nowcasting-downsample = nowcasting.cli.downsample_memmap_dataset:main
    nowcasting-convert-sparse-targets = nowcasting.cli.convert_dense_targets_to_sparse:main
    nowcasting-evaluate-persistence = nowcasting.cli.evaluate_persistence:main
    nowcasting-export-websirene-maxima = nowcasting.cli.export_websirene_maxima:main
    nowcasting-audit-websirene = nowcasting.cli.audit_websirene:main
    nowcasting-compare-websirene-alertario = nowcasting.cli.compare_websirene_alertario:main
    nowcasting-audit-station-target-alignment = nowcasting.cli.audit_station_target_alignment:main

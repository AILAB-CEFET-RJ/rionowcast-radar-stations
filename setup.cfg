[metadata]
name = rionowcast-radar-stations
version = 0.1.0
description = Pipeline de nowcasting com radar do Sumare e estacoes pluviometricas.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    nowcasting-train = nowcasting.cli.train:main
    nowcasting-train-stations = nowcasting.cli.train_station_baseline:main
    nowcasting-compare = nowcasting.cli.compare_experiments:main
    nowcasting-build-radar = nowcasting.cli.build_radar_memmaps:main
    nowcasting-audit-radar-pngs = nowcasting.cli.audit_radar_pngs:main
    nowcasting-audit-historical-station-mapping = nowcasting.cli.audit_historical_station_mapping:main
    nowcasting-audit-historical-radar-events = nowcasting.cli.audit_historical_radar_events:main
    nowcasting-audit-training-seasonality = nowcasting.cli.audit_training_seasonality:main
    nowcasting-build-historical-station-mapping = nowcasting.cli.build_historical_station_mapping:main
    nowcasting-inspect-radar-capture = nowcasting.cli.inspect_radar_capture:main
    nowcasting-select-operational-events = nowcasting.cli.select_operational_events:main
    nowcasting-infer-operational = nowcasting.cli.infer_operational:main
    nowcasting-transform-station-mapping = nowcasting.cli.transform_station_mapping:main
    nowcasting-audit-capture-mapping = nowcasting.cli.audit_capture_mapping:main
    nowcasting-render-operational-mock = nowcasting.cli.render_operational_mock:main
    nowcasting-build-ibge-basemap = nowcasting.cli.build_ibge_basemap:main
    nowcasting-build-alertario-targets = nowcasting.cli.build_alertario_targets:main
    nowcasting-build-alertario-sparse-targets = nowcasting.cli.build_alertario_sparse_targets:main
    nowcasting-audit-alertario = nowcasting.cli.audit_alertario:main
    nowcasting-build-websirene-targets = nowcasting.cli.build_websirene_targets:main
    nowcasting-downsample = nowcasting.cli.downsample_memmap_dataset:main
    nowcasting-convert-sparse-targets = nowcasting.cli.convert_dense_targets_to_sparse:main
    nowcasting-evaluate-persistence = nowcasting.cli.evaluate_persistence:main
    nowcasting-export-websirene-maxima = nowcasting.cli.export_websirene_maxima:main
    nowcasting-audit-websirene = nowcasting.cli.audit_websirene:main
    nowcasting-compare-websirene-alertario = nowcasting.cli.compare_websirene_alertario:main
    nowcasting-audit-station-target-alignment = nowcasting.cli.audit_station_target_alignment:main
    nowcasting-download-goes16-abi = nowcasting.cli.download_goes16_abi:main
    nowcasting-build-goes16-memmaps = nowcasting.cli.build_goes16_memmaps:main
    nowcasting-stream-goes16-memmaps = nowcasting.cli.stream_goes16_memmaps:main
    nowcasting-audit-goes16 = nowcasting.cli.audit_goes16:main
    nowcasting-select-goes16-pilot-events = nowcasting.cli.select_goes16_pilot_events:main
    nowcasting-select-goes16-hard-events = nowcasting.cli.select_goes16_hard_events:main
    nowcasting-build-goes16-event-pilot = nowcasting.cli.build_goes16_event_pilot:main
    nowcasting-audit-goes16-event-pilot = nowcasting.cli.audit_goes16_event_pilot:main
    nowcasting-analyze-goes16-event-pilot = nowcasting.cli.analyze_goes16_event_pilot:main
    nowcasting-evaluate-optical-flow = nowcasting.cli.evaluate_optical_flow:main
